name: 배포가 정말 떴나 점검

# 2026-10-10~11 에 **운영 배포 다섯 번이 줄줄이 ERROR** 였는데 아무도
# 몰랐습니다 (89bdad9 · 3394655 · 89d2353 · ae5abef · 887ece4).
# 사이트는 닷새 전 커밋(157c7fc)으로 계속 돌고 있었습니다.
# 까닭은 JSX 주석을 태그 **속성 자리**에 넣은 것이고, `npx tsc --noEmit`
# 한 번이면 잡혔습니다.
#
# 그래서 그물 둘을 함께 겁니다.
#   ① 밀기 전  — tsc 와 next build (사람이 지키는 규칙 · CLAUDE.md 13절)
#   ② 민 뒤    — **이 일감**. 운영 화면이 정말 이 커밋인지 밖에서 묻습니다
#
# Vercel 토큰이 없어도 돕니다 — 화면 스스로 /api/build 에서
# VERCEL_GIT_COMMIT_SHA 를 말합니다 (web/app/api/build/route.ts).
#
# 실패하면 GitHub 이 저장소 주인에게 메일을 보냅니다.

on:
  push:
    branches: [main]
  schedule:
    - cron: '40 21 * * *'    # 한국시간 아침 6시 40분 (비로그인 점검 20분 뒤)
  workflow_dispatch:

concurrency:
  group: deploy-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 운영 화면이 어느 커밋인지 묻습니다
        env:
          BUILD_URL: https://potjob-web.vercel.app/api/build
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          # 운영 화면(web/)을 마지막으로 바꾼 커밋을 기대값으로 삼습니다.
          # web/ 밖 커밋(main 끝)은 Vercel 이 같은 화면을 다시 짓지 않으므로 견주지 않습니다.
          # 루프 전에 한 번만 정하고, 비었거나 git 이 실패하면 통과시키지 않습니다.
          EXPECTED_SHA=$(git log --first-parent -1 --format=%H -- web) || EXPECTED_SHA=""
          if [ -z "$EXPECTED_SHA" ]; then
            echo "✗ 마지막 web 커밋을 찾지 못했습니다 — 기대값 없이는 점검할 수 없습니다."
            exit 1
          fi
          # 밀고 나면 Vercel 이 짓는 데 시간이 걸립니다. 15초마다 20분까지 기다립니다.
          # 날마다 도는 쪽은 기다릴 까닭이 없으니 한 번만 봅니다.
          if [ "$EVENT_NAME" = "push" ]; then MAX_ATTEMPTS=80; else MAX_ATTEMPTS=1; fi
          i=0
          while [ "$i" -lt "$MAX_ATTEMPTS" ]; do
            i=$((i+1))
            body=$(curl -fsS --max-time 20 "$BUILD_URL" || echo '{}')
            current_sha=$(printf '%s' "$body" | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p')
            if [ -n "$current_sha" ]; then
              echo "[$i] 운영 화면 = ${current_sha:0:7}"
            else
              echo "[$i] /api/build 가 아직 답하지 않습니다 — $body"
            fi
            if [ "$current_sha" = "$EXPECTED_SHA" ]; then
              echo "○ 운영 화면이 ${EXPECTED_SHA:0:7} 입니다"
              exit 0
            fi
            [ "$i" -lt "$MAX_ATTEMPTS" ] && sleep 15
          done
          echo "✗ 운영 화면이 ${EXPECTED_SHA:0:7} 가 아닙니다 (지금 ${current_sha:-모름})."
          echo "   Vercel 배포가 ERROR 이거나 아직 안 끝났습니다."
          echo "   https://vercel.com/think33100-7375s-projects/potjob-web 에서 보십시오."
          exit 1
