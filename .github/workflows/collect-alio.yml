name: 알리오 수집 (AL2 · 새 수집기)

# 시트를 거치지 않고 DB 에 바로 담습니다.
# 「공고 가져오기(sync.yml)」 는 옛 쪽 시트를 나르는 다른 일입니다 — 건드리지 마세요.
#
# 사흘 대조가 끝나기 전까지는 source = AL2 로만 담습니다.
# 옛 수집기(gas · source = AL)는 그대로 돌고, 둘을 견줍니다.
on:
  # ⚠ 30분 크론을 **잠시 멈춰 뒀습니다** (2026-09-26).
  #   OCR 을 고치는 중입니다. 지금 담기 시작하면 PDF 공고가 전부 보류함으로
  #   가서 사흘 대조가 흐려집니다. OCR 이 되는 것을 확인한 뒤 아래 두 줄의
  #   주석을 벗기면 다시 30분마다 돕니다.
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: '담지 말고 옛것과 대조만 할까요'
        type: boolean
        default: false

# 앞 차례가 아직 돌고 있으면 기다립니다. 같은 공고를 두 번 담아도
# 공고 번호로 맞춰 담으니 자료는 안 깨지지만, 기록이 지저분해집니다.
concurrency:
  group: collect-alio
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 알리오 받아 담기
        env:
          # 공공데이터포털 — 둘 다 이미 인코딩된 키입니다. 다시 감싸면 안 됩니다
          ALIO_LIST_KEY: ${{ secrets.ALIO_LIST_KEY }}
          ALIO_DETAIL_KEY: ${{ secrets.ALIO_DETAIL_KEY }}
          # Supabase — service_role 이 아니라 anon 입니다.
          # 쓰기는 collect_put() 함수 하나로만 갑니다
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          COLLECT_KEY_AL2: ${{ secrets.COLLECT_KEY_AL2 }}
          # 첨부 공고문 OCR — gas/ocr 웹앱(세중님 계정)에 맡깁니다.
          # 서비스 계정은 드라이브 용량 0 으로, OAuth 는 7일 만료로 접었습니다.
          # 없으면 PDF 공고는 보류함으로 갑니다 — 버리지 않습니다
          OCR_GAS_URL: ${{ secrets.OCR_GAS_URL }}
          OCR_KEY: ${{ secrets.OCR_KEY }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then
            node tools/collect-alio.mjs --dry
          else
            node tools/collect-alio.mjs
          fi
