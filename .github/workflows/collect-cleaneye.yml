name: 클린아이 수집 (CE2 · 새 수집기)

# 시트를 거치지 않고 DB 에 바로 담습니다.
# 「공고 가져오기(sync.yml)」 는 옛 쪽 시트를 나르는 다른 일입니다 — 건드리지 마세요.
#
# 사흘 대조가 끝나기 전까지는 source = CE2 로만 담습니다.
# 옛 수집기(gas · collectJobs2 · source = CE)는 그대로 돌고, 둘을 견줍니다.
#
# ── 왜 2시간마다인가 (알리오는 30분) ─────────────────────────
# 클린아이는 첨부 다운로드를 **건수로** 막습니다 — 15건쯤에서 HTTP 429
# 「다운로드 요청이 많습니다」. 30분마다 돌면 통이 비어 있는 채로 계속
# 두드리게 됩니다. 한 번에 15건만 읽고 못 읽은 것은 다음 번으로 넘깁니다.
# 의료 공고가 하루 95건이라 2시간마다면 하루에 다 훑습니다.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: '담지 말고 옛것과 대조만 할까요'
        type: boolean
        default: false

concurrency:
  group: collect-cleaneye
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 클린아이 받아 담기
        env:
          # 공공데이터포털 — **알리오 상세와 같은 열쇠입니다.**
          # 이 열쇠를 갈면 두 경로가 같이 멈춥니다
          CLEANEYE_KEY: ${{ secrets.CLEANEYE_KEY }}
          ALIO_DETAIL_KEY: ${{ secrets.ALIO_DETAIL_KEY }}
          # Supabase — service_role 이 아니라 anon 입니다.
          # 쓰기는 collect_put() 함수 하나로만 갑니다
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          COLLECT_KEY_CE2: ${{ secrets.COLLECT_KEY_CE2 }}
          # 첨부 PDF OCR — gas/ocr 웹앱(세중님 계정).
          # 한글(.hwp)은 tools/hwp 가 읽으므로 열쇠가 필요 없습니다.
          # 없으면 PDF 공고는 보류함으로 갑니다 — 버리지 않습니다
          OCR_GAS_URL: ${{ secrets.OCR_GAS_URL }}
          OCR_KEY: ${{ secrets.OCR_KEY }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then
            node tools/collect-cleaneye.mjs --dry
          else
            node tools/collect-cleaneye.mjs
          fi
