name: 새 공고 알림 보내기

on:
  schedule:
    # 한국시간 08:20 · 13:20 · 19:20 (UTC 기준으로 적습니다)
    - cron: '20 23 * * *'
    - cron: '20 4 * * *'
    - cron: '20 10 * * *'
  workflow_dispatch:        # 손으로 눌러 시험 발송할 때 씁니다

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 준비
        run: npm install web-push --no-save

      - name: 보내기
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_MAIL: ${{ secrets.VAPID_MAIL }}
        run: node scripts/send-push.js
