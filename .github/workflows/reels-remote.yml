# 릴스 원격 — 대화나 휴대폰에서 「목록 · 확인 · 올리기 · 만들기」를 서버에 시킵니다 (2026-11-17)
#
# 이 작업이 서버에 ssh 로 들어가면, 서버 authorized_keys 의 강제 명령이
#   cd ~/potlab && node tools/reels/원격명령.mjs
# 만 돌립니다. 그 열쇠로는 서버 셸을 못 엽니다 (tools/reels/원격명령.mjs 머리글).
#
# 비밀 셋 (저장소 Settings → Secrets and variables → Actions)
#   REELS_SSH_KEY          이 작업 전용 열쇠(개인키) 전문
#   REELS_SSH_HOST         ubuntu@<서버 공인 주소>
#   REELS_SSH_KNOWN_HOSTS  서버 호스트 키 한 줄 — 남의 서버에 붙지 않게 (지침 8-5)
name: reels-remote

on:
  workflow_dispatch:
    inputs:
      action:
        description: "할일 — list(목록) · check(확인·마른) · publish(릴스 올리기) · check-cards · publish-cards(카드뉴스) · make(만들기) · pull(서버 git pull) · dm-check(댓글 「링크」 찾기·마른) · dm-send(DM 보내기)"
        required: true
        type: choice
        options: [list, check, publish, check-cards, publish-cards, make, pull, brand-check, brand-publish, brand-replace, brand-comment, dm-check, dm-send, dm-word, app-shots, check-story, publish-story, replace-story, delete-post, logo-stories, sound-check, replace-cards]
      job_id:
        description: "공고 id (list 는 비움) — 예 306973-PT · brand-* 는 판 이름(intro · story · guide)"
        required: false
        type: string
      word:
        description: "dm-word 만 — 그 게시물 댓글 단어(한글·영문·숫자 1~20자) · 지우기는 -"
        required: false
        type: string

concurrency:
  group: reels-remote
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 서버에 시키기
        env:
          KEY: ${{ secrets.REELS_SSH_KEY }}
          HOST: ${{ secrets.REELS_SSH_HOST }}
          KNOWN: ${{ secrets.REELS_SSH_KNOWN_HOSTS }}
          ACTION: ${{ inputs.action }}
          JOB_ID: ${{ inputs.job_id }}
          WORD: ${{ inputs.word }}
        run: |
          set -eu
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$KNOWN" ]; then echo "비밀 셋(REELS_SSH_KEY · REELS_SSH_HOST · REELS_SSH_KNOWN_HOSTS)이 다 있어야 합니다"; exit 1; fi
          case "$JOB_ID" in *[!A-Za-z0-9_-]*) echo "공고 id 는 영문·숫자·-·_ 만"; exit 1;; esac
          WORD=$(printf '%s' "$WORD" | tr -d '[:space:]')
          # 한글(UTF-8 바이트) · 영문 · 숫자 · - 밖의 글자가 남으면 거절 — 길이·꼴은 서버(원격명령.mjs)가 다시 봅니다
          if [ -n "$(printf '%s' "$WORD" | LC_ALL=C tr -d 'A-Za-z0-9\200-\377-')" ]; then echo "단어는 한글·영문·숫자 1~20자 (지우기는 -)"; exit 1; fi
          # 붙여 넣을 때 딸려 온 빈칸·줄바꿈(\r)을 걷습니다. 그래도 꼴이 틀리면 값은 가리고 모양만 찍습니다
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]')
          KNOWN=$(printf '%s' "$KNOWN" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if ! printf '%s' "$HOST" | grep -Eq '^[a-z_][a-z0-9_-]*@[A-Za-z0-9.-]+$'; then
            echo "REELS_SSH_HOST 꼴이 「ubuntu@숫자.숫자.숫자.숫자」가 아닙니다 — 길이 $(printf '%s' "$HOST" | wc -c) · @ $(printf '%s' "$HOST" | tr -cd '@' | wc -c)개"
            echo "  이상한 글자 코드: $(printf '%s' "$HOST" | LC_ALL=C tr -d 'A-Za-z0-9@._-' | od -An -tx1 | tr -s ' ' | head -c 120)"
            echo "  (명령 자체를 넣었으면 따옴표·\$·괄호 코드 22 24 28 29 가 보입니다)"
            exit 1
          fi
          case "$KNOWN" in *" ssh-ed25519 "*) ;; *) echo "REELS_SSH_KNOWN_HOSTS 꼴이 「주소 ssh-ed25519 AAAA…」 한 줄이 아닙니다"; exit 1;; esac
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/reels && chmod 600 ~/.ssh/reels
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/reels -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30 "$HOST" "$ACTION $JOB_ID $WORD"
