name: 원문 살아있나 확인 (주 1회)

# 마감일이 **없는** 공고만 봅니다 (「수시모집」 「상시」).
# 날짜로 끝을 알 수 없으니 원문이 살아 있는지 직접 봅니다.
#
# 세 갈래로만 답합니다 —
#   alive    글이 있습니다               → gone_streak 0
#   gone     404 · 「존재하지 않는 글」   → gone_streak +1, **두 번 연속**이면 감춤
#   unknown  타임아웃 · 5xx · 막힘       → 아무것도 안 바꿉니다
#
# 두 번 연속으로 하는 까닭 — 사이트 점검 중에 한 번 404 가 나는 일이 흔합니다.
# 한 번으로 감추면 멀쩡한 공고가 사라집니다.
on:
  schedule:
    - cron: '40 20 * * 0'    # 한국시간 월요일 05:40
  workflow_dispatch:
    inputs:
      dry:
        description: '확인만 하고 기록하지 않을까요'
        type: boolean
        default: false

concurrency:
  group: alive
  cancel-in-progress: false

jobs:
  alive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 돌다가 죽는 것 검사 (node --check 로는 안 잡히는 종류)
      - name: 돌다가 죽는 것 검사
        run: |
          npm install --no-save --silent eslint@9.39.5
          node tools/lint.mjs --tools

      - name: 원문 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # alive_mark 의 열쇠. service_role 이 아니라 쓰기 전용 함수로만 갑니다
          ALIVE_KEY: ${{ secrets.ALIVE_KEY }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then
            node tools/alive.mjs --dry
          else
            node tools/alive.mjs
          fi
