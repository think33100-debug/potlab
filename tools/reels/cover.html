<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- RAPO 릴스·카드뉴스 커버 (2026-11-17 세중님 「커버 이미지는 톤앤매너 맞게 따로 · 시그니처 컬러에 흰색 글」)
     tools/reels/카드.mjs 의 커버만들기() 가 window.__setData(자료, 판) 을 부르고 찍습니다.
     판 = 'reel'(1080×1920 · 글은 가운데 1350 안 — 프로필 격자가 가운데만 보여 줌) · 'card'(1080×1350 · 카드뉴스 첫 장)
     글은 전부 자료(공고·기관 공식 값)에서 옵니다 — 커버라고 따로 지어 쓰는 말이 없습니다 -->
<style>
  @font-face { font-family: "PretendardV"; src: url("fonts/PretendardVariable.woff2") format("woff2"); font-weight: 100 900; }
  /* 2026-11-18 세중님 「눈이 아프다 · 추천대로」 — ② 세이지 + 네이비: 넓은 바탕은 연한 세이지, 코랄은 강조 글자에만 (차분한 #D9776C) */
  :root { --coral: #D9776C; --navy: #2C3E4C; --ink: #22313D; --sage: #E7EEE9; --white: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--sage); }
  body { font-family: "PretendardV", sans-serif; color: var(--ink); word-break: keep-all; letter-spacing: -0.02em; }
  body.card, html.card { height: 1350px; }
  /* 커다란 열린 테두리 — OG 그림·영상과 같은 말 (오른쪽 위가 열림) */
  #frame { position: absolute; left: 60px; right: 60px; border: 0; }
  #frame svg { width: 100%; height: 100%; overflow: visible; }
  #box { position: absolute; left: 0; right: 0; top: 285px; height: 1350px; padding: 110px 110px 100px; display: flex; flex-direction: column; }
  body.card #box { top: 0; }
  #logo { display: flex; align-items: center; gap: 16px; }
  #logo img.sym { width: 64px; height: 63px; filter: saturate(0.62) brightness(1.05); }
  #logo img.word { filter: brightness(0) saturate(100%) invert(16%) sepia(18%) saturate(900%) hue-rotate(165deg); }
  #logo img.word { height: 32px; }
  #eyebrow { margin-top: 120px; align-self: flex-start; font-size: 40px; font-weight: 700; background: var(--white); color: var(--coral); padding: 10px 24px; border-radius: 12px; }
  #org { margin-top: 30px; font-size: 104px; font-weight: 800; line-height: 1.12; }
  #job { margin-top: 10px; font-size: 104px; font-weight: 800; line-height: 1.12; }
  #job .em { position: relative; color: var(--coral); }
  #job .em i { position: absolute; left: -6px; right: -6px; bottom: 8px; height: 30px; background: rgba(217,119,108,0.18); z-index: -1; }
  #rows { margin-top: auto; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: baseline; gap: 22px; font-size: 46px; font-weight: 700; }
  .row .k { font-size: 34px; font-weight: 600; color: #5E6B73; width: 150px; flex: none; }
  .row small { display: block; font-size: 28px; font-weight: 600; color: #5E6B73; margin-top: 4px; }
  #foot { margin-top: 56px; font-size: 32px; font-weight: 700; color: #5E6B73; }
  /* 2026-11-18 세중님 「D-7 동그라미가 AI 티가 남 · 공고 쪽으로 화살표 · D-7 은 고급스럽게」
     → 오른쪽 위는 브랜드 카드와 같은 화살표(공고 글을 가리킴) · D-day 는 아래 줄 오른쪽에 가는 글자로 */
  #arrow { position: absolute; right: 110px; width: 120px; height: 120px; transform: rotate(-90deg); filter: saturate(0.62) brightness(1.05); }
  #bottom { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; }
  #bottom #rows { margin-top: 0; }
  #dday { flex: none; text-align: right; color: var(--navy); padding-left: 34px; border-left: 2px solid rgba(44,62,76,0.18); }
  #dday span { display: block; font-size: 26px; font-weight: 600; letter-spacing: 0.12em; color: #5E6B73; }
  #dday b { display: block; font-size: 128px; font-weight: 300; line-height: 0.95; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-top: 8px; }
  /* 직군 색 — 하이라이트(PT 파랑 · OT 초록 · 공통 모래)와 같은 결로 바탕을 아주 옅게 · 작은 직군 칩 (2026-11-18 「OT PT 두 공고가 겹쳐 보일까」) */
  body[data-job="pt"] { --sage: #E5EBF2; --tag: #8FA6BF; }
  body[data-job="ot"] { --sage: #E7EEE9; --tag: #8DB09C; }
  body[data-job="both"] { --sage: #EFEAE2; --tag: #C7AE7E; }
  html:has(body[data-job]) { background: var(--sage); }
  #tags { margin-top: 120px; display: flex; gap: 14px; align-items: center; }
  #tags #eyebrow { margin-top: 0; }
  #jobtag { font-size: 40px; font-weight: 800; color: var(--white); background: var(--tag, #8DB09C); padding: 10px 22px; border-radius: 12px; }
</style>
</head>
<body>
<div id="frame"><svg viewBox="0 0 960 1000" preserveAspectRatio="none"><path d="M640 6H6V994H954V140" stroke="#2C3E4C" stroke-opacity="0.35" stroke-width="10" fill="none" vector-effect="non-scaling-stroke"/></svg></div>
<div id="box">
  <div id="logo"><img class="sym" src="assets/symbol.svg" alt=""><img class="word" src="assets/wordmark.svg" alt=""></div>
  <div id="tags"><div id="jobtag"></div><div id="eyebrow"></div></div>
  <div id="org"></div>
  <div id="job"></div>
  <div id="bottom"><div id="rows"></div><div id="dday"><span>마감까지</span><b id="ddayb"></b></div></div>
  <div id="foot">프로필 링크 → RAPO에서 원문 공고</div>
</div>
<img id="arrow" src="assets/arrow.svg" alt="">
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
window.__setData = (d, 판 = 'reel') => {
  const 카드 = 판 === 'card';
  document.body.classList.toggle('card', 카드); document.documentElement.classList.toggle('card', 카드);
  const 위 = 카드 ? 0 : 285;
  /* 테두리 · D-day 는 상자 기준으로 놓습니다 */
  $('frame').style.top = (위 + 50) + 'px'; $('frame').style.height = 1250 + 'px';
  $('arrow').style.top = (위 + 105) + 'px';     /* 로고 줄 오른쪽 위 — 공고 글을 가리킴 */
  const 직군 = String(d.직군 || '');
  const 갈래 = /물리/.test(직군) && /작업/.test(직군) ? 'both' : /물리/.test(직군) ? 'pt' : /작업/.test(직군) ? 'ot' : 'both';
  document.body.dataset.job = 갈래;
  $('jobtag').textContent = { pt: 'PT', ot: 'OT', both: 'PT · OT' }[갈래];
  const 훅 = d.훅 || {};
  $('eyebrow').textContent = 훅.작은 && 훅.작은 !== '새 공고' ? 훅.작은 : (d.분류 || []).join(' · ') || '새 공고';
  $('org').textContent = String(d.기관 || '').replace(/^(학교법인|의료법인|사회복지법인|재단법인)\s*/, '');
  $('job').innerHTML = `<span class="em"><i></i>${esc(d.걸기 || (d.직군 + ' 채용'))}</span>`;
  $('ddayb').textContent = d.마감?.큰글 || '';
  const 값 = (이름) => (d.공고?.줄 || []).find((r) => r.이름 === 이름)?.값 || null;
  const 줄 = [
    ['접수', d.마감?.작은글?.replace(/ 마감$/, '까지') || null],
    ['급여', 값('급여'), (d.공고?.줄 || []).find((r) => r.이름 === '급여')?.덧 || null],
    ['모집', [값('모집인원'), d.공고?.고용형태].filter(Boolean).join(' · ') || null],
  ].filter(([, v]) => v);
  $('rows').innerHTML = 줄.map(([k, v, 덧]) => `<div class="row"><span class="k">${esc(k)}</span><span>${esc(v)}${덧 ? `<small>${esc(덧)}</small>` : ''}</span></div>`).join('');
  /* 긴 이름은 폭에 맞을 때까지 줄입니다 (두 줄까지) */
  for (const id of ['org', 'job']) {
    const e = $(id); let k = 104; e.style.fontSize = k + 'px';
    e.style.wordBreak = 'keep-all';
    while ((e.scrollWidth > e.clientWidth + 1 || e.offsetHeight > k * 1.12 * 2 + 4) && k > 60) { k -= 4; e.style.fontSize = k + 'px'; }
    /* 띄어쓰기 없는 긴 이름(고려대학교의과대학부속안산병원)은 글자 단위로 줄을 바꿉니다 */
    if (e.scrollWidth > e.clientWidth + 1) e.style.wordBreak = 'break-all';
  }
};
</script>
</body>
</html>
