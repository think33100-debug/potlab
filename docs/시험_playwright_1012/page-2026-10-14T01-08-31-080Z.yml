                - heading "고려대의료원·고려대의대교우회, 스리랑카 이주노동자 위한 의료봉사 펼쳐" [level=3] [ref=f5e335]
              - generic [ref=f5e336]: 고려대의료원·고려대의대교우회, 스리랑카 이주노동자 위한 의료봉사 펼쳐 충남 아산시에서 스리랑카 이주노동자 300여 명 대상 무료 진료 진료·검사·정신건강상담부터 심폐소생술 교육까지 종합 의료지원고려대학교의료원(의무부총장 겸 의료원장 윤을식)과 고려대학교 의과대학 교우회(교우회장 윤형선)가 국내 거주 스리랑카 이주노동자들의 건강 증진을 위해 뜻을 모았다.양 기관은 지난 9월 13일 충남 아산시 음봉면에 위치한 스리랑카 사원인 마하위하라사에서 스리랑카 이주노동자 300여 명을 대상으로 의료봉사를 펼쳤다. 2023년 시작해 올해로 8회째를 맞은 이번 봉사는 언어 장벽과 근무 환경 등으로 의료기관을 찾기 어려운 이주노동자들의 질환을 조기에 발견하고 체계적인 건강관리를 돕기 위해 마련됐다.이날 봉사에는 고려대 구로병원 가정의학과 김선미, 이도희 교수를 비롯한 고려대병원 및 의대교우회 의료봉사회 소속 의사와 간호사, 임상병리사, 심리상담사, 통역 자원봉사자 등 총 70여 명이 참여했다. 의료진은 내과·가정의학과 진료와 함께 복부초음파, 흉부 X-ray 촬영, 안저검사, 채혈 등을 실시했다. 특히 씨젠의료재단과 협업해 52개 항목의 혈액검사를 시행하고 만성질환 위험 요인을 종합적으로 점검했으며, 검사 결과를 바탕으로 개인별 건강관리 방법도 안내했다. 신체 건강뿐 아니라 마음 건강도 함께 살폈다. 전문 상담 인력이 우울·불안 척도 검사를 통해 고위험군을 선별하고, 타국 생활과 근로 과정에서 겪는 정서적 어려움을 돌보는 정신건강상담을 진행했다. 아울러 일상생활과 산업현장에서 발생할 수 있는 응급상황에 대처할 수 있도록 실습 중심의 심폐소생술(CPR) 교육도 마련했다. 진료와 검사, 교육 등 전 과정에 통역 자원봉사자를 배치해 의료진과 이주노동자 간 원활한 의사소통을 돕고, 보다 정확한 진료와 건강상담이 이뤄질 수 있도록 했다. 윤을식 고려대학교 의무부총장 겸 의료원장은 "언어와 환경의 제약으로 적절한 의료서비스를 이용하기 어려운 이주노동자들에게 이번 의료봉사가 작은 보탬이 되었기를 바란다"며 "앞으로도 의술을 통해 인류애를 실천하고, 의료취약계층을 위한 사회공헌활동을 지속적으로 확대해 나가겠다"고 말했다.봉사단장인 고려대의대교우회 정인주 봉사부회장은 "휴일에도 이역만리에서 땀 흘리는 노동자들의 건강을 살피기 위해 한마음으로 함께해 준 봉사단원들에게 감사드린다"며 "앞으로도 의료 사각지대에 실질적인 도움을 줄 수 있는 의료봉사 활동을 꾸준히 이어가겠다"고 밝혔다.한편, 고려대의료원은 의대교우회를 비롯한 다양한 기관·단체와 협력해 의료서비스 접근에 어려움을 겪는 국내외 의료취약계층을 위한 의료지원과 사회공헌활동을 꾸준히 펼쳐 나갈 계획이다.
