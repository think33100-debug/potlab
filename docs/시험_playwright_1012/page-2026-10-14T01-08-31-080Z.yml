                - heading "신일우·홍남희 부부, 고대의료원에 발전기금 2억 원 기부" [level=3] [ref=f5e345]
              - generic [ref=f5e346]: 신일우·홍남희 부부, 고대의료원에 발전기금 2억 원 기부의료진 노고에 감사 전하며 부부가 함께 나눔 실천해고려대학교의료원(의무부총장 겸 의료원장 윤을식)이 신일우(고려대 경영대학원 연구과정 35회, 前 오가약국 대표)·홍남희 부부로부터 발전기금 2억 원을 기부받았다.기부식은 지난 14일(월) 오후 2시 고려대학교 본관 프레지던트챔버홀에서 열렸으며, 김동원 총장, 윤을식 의무부총장, 신호정 대외협력처장, 한승범 안암병원장 등 고려대 주요 보직자와 신일우·홍남희 부부와 가족들이 참석한 가운데 진행됐다.어린 시절 어려운 가정 환경 속에서도 배움을 이어온 신일우 교우는 서울 종로 5가에서 약국을 30여 년간 운영하며 성실하게 한 길을 걸어왔다. 평소 자신이 오늘날의 삶을 이룰 수 있었던 것은 주변의 도움 덕분이라는 신념으로, 감사의 마음을 사회에 다시 나누는 것을 삶의 중요한 가치로 여기며 꾸준히 후원과 기부를 이어왔다.특히, 이번 기부는 신일우 교우와 부인 홍남희 여사가 고대안암병원 의료진에 대한 깊은 감사의 뜻을 담아 각 1억 원씩 총 2억 원을 함께 전달해 그 의미를 더했다. 신일우 교우는 정형외과 이형래 교수에게, 홍남희 여사는 순환기내과 김영훈 교수에게 진료를 받은 후 노고에 보답하고자 각 임상과 발전기금을 전달했다.신일우 교우는 “살아오면서 제가 받은 도움과 은혜가 많았다는 것을 늘 생각하고 있으며, 받은 것들을 조금이나마 다시 나누고 고려대와 의료 발전에 보탬이 될 수 있다면 그것만으로도 감사한 일”이라며, “앞으로도 제가 할 수 있는 범위 내에서 사회와 병원에 보탬이 되는 나눔을 계속 이어가고 싶다”라고 기부 소감을 전했다.홍남희 여사는 “날로 새로워지는 고대안암병원의 모습을 보며 우리 부부에게 참으로 특별하고 친근한 병원이라고 생각했다”라며, “정성으로 진료해 주신 김영훈 교수님을 비롯한 의료진분들에게 감사드리며, 이번 기부가 안암병원이 환자들에게 더욱 따뜻한 안식처가 되는 데 도움이 되길 바란다”라고 밝혔다.김동원 총장은 “평생에 걸쳐 모은 귀한 재산을 병원과 사회를 위해 아낌없이 나눌 줄 아시는 교우님 부부의 숭고한 정신에 깊은 존경을 표한다”라며, “전해주신 소중한 마음이 고려대와 의료원의 미래를 밝히는 큰 빛이 되도록 최선을 다하겠다”라고 감사를 전했다.윤을식 의무부총장은 “의료진을 향한 신뢰와 감사의 마음으로 발전기금을 전달해 주신 신일우 교우님과 홍남희 여사님께 진심으로 감사드린다”라며, “두 분의 따뜻한 뜻을 받들어 환자 중심의 의료 혁신을 이루고 최고의 의료 인재를 양성하는 데 소중히 사용하겠다”라고 화답했다.
