              - heading "고려대의료원, ‘SMTOWN RUN CLUB 26’ 의료지원 나서" [level=3] [ref=f5e302]
            - generic [ref=f5e303]: 고려대의료원, ‘SMTOWN RUN CLUB 26’ 의료지원 나서의료부스·구급차 운영부터 건강체험까지 현장 밀착형 의료지원SM엔터테인먼트와 ESG 협력…의료·문화 연계 사회공헌 실천고려대학교의료원(의무부총장 겸 의료원장 윤을식)이 대규모 러닝 행사 현장에서 참가자들의 건강과 안전을 지원하며 의료기관의 사회적 책임을 실천했다.고려대의료원은 지난 10월 3일 인천 영종도 왕산마리나항에서 열린 ‘SMTOWN RUN CLUB 26’에 참여해 현장 의료지원과 건강체험 프로그램을 운영했다.SM엔터테인먼트가 주최한 ‘SMTOWN RUN CLUB 26’은 러닝과 콘서트를 결합한 대규모 행사로, 아티스트와참가자가 함께 달리며 공연과 다양한 프로그램을 즐겼다.고려대의료원은 이날 고려대 안암·구로·안산병원의 의사, 간호사, 응급구조사와 사회공헌사업팀 등 총 21명으로 의료지원단을 구성했다. 고려대 안암병원 신경외과 오영규 교수 등이 참여했으며, 행사장과 러닝 코스 주요 지점에서 참가자들의 건강과 안전을 살폈다.행사장 내 의료부스에서는 러닝 중 발생할 수 있는 찰과상과 외상 등에 대한 드레싱을 비롯해 기본적인 응급처치를 제공했다. 코스 주요 구간에는 고려대학교의료원 스마트 의료기기-이동형 병원과 3대의 구급차를 배치해 응급상황 발생 시 신속하게 대응할 수 있도록 현장 의료지원 체계를 갖췄다.참가자들이 자신의 건강 상태를 직접 확인할 수 있는 체험 프로그램도 마련했다. 폐활량검사와 체성분검사(IBody) 등을 통해 신체 상태를 점검하고 일상 속 건강관리의 중요성을 체감할 수 있도록 했다.특히 이번 행사에는 유방암 환우회 회원 16명이 참가해 의미를 더했다. 환우들은 서로를 격려하며 코스를 달리고, 건강한 일상으로의 회복과 새로운 도전, 연대의 의미를 함께 나눴다. 고려대의료원 의료지원단도 환우를 비롯한 참가자들이 안전하게 행사를 즐길 수 있도록 현장에서 의료지원을 이어갔다.고려대학교 의과대학과 고려대학교의료원의 공식 마스코트 ‘호의랑’도 의료지원단과 함께 현장을 찾아 참가자들을 응원했다. 이날 행사에는 SM엔터테인먼트 소속 아티스트 샤이니 민호를 비롯해, 동방신기 최강창민, 소녀시대 유리, 엑소 수호, WayV 쿤, 샤오쥔, 헨드리, 양양, 하츠투하츠, 배우 조준영이 참여해 러너들과 함께 호흡한 것은 물론, 레이스 후에는 하츠투하츠, WayV, 민호가 무대를 선사해 현장 분위기를 더했다. ‘생명을 수호하는 의사 호랑이’라는 의미를 담은 ‘호의랑’은 의료진과 함께 참가자들과 기념사진을 촬영하고 러너들을 응원하며 활기를 더했다. 의료진과 호의랑, 아티스트들이 함께 참가자들과 소통하며 건강과 생명존중의 가치를 친근하게 전달했다.이번 의료지원은 고려대의료원과 SM엔터테인먼트가 이어오고 있는 ESG 사회공헌 협력의 일환으로 마련됐다. 양 기관은 지난해 12월 29일 사회적 가치 실현과 지속가능한 ESG 경영을 위한 업무협약을 체결하고, 각 기관의 전문성과 인프라를 활용해 다양한 사회공헌 활동을 추진하고 있다.이번 행사를 통해 고려대의료원의 의료 전문성과 SM엔터테인먼트의 문화 콘텐츠 역량을 연계해 건강과 안전, 나눔의 가치를 현장에서 함께 실천했다.윤을식 고려대학교 의무부총장 겸 의료원장은 “이번 행사를 통해 SM엔터테인먼트와 함께 참가자들의 건강과 안전을 살피고, 의료와 문화가 연계된 사회공헌의 가치를 실천할 수 있어 뜻깊다”며 “앞으로도 양 기관의 강점을 바탕으로 다양한 협력 활동을 이어가며 국민 건강 증진과 사회적 가치 실현에 기여해 나가겠다”고 말했다.
