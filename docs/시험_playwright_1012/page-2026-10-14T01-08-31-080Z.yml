              - generic [ref=f5e326]: 고려대의료원, 존스홉킨스·텍사스 메디컬 센터와 잇단 협력국내 바이오·의료기술 미국 진출 지원 확대 미국 대표 의료혁신기관 잇달아 초청해 파트너링 행사 개최연구·임상 검증부터 FDA 인허가·투자유치까지 협력 모색 고려대학교의료원(의무부총장 겸 의료원장 윤을식)이 국내 바이오·의료기술의 해외 진출을 돕기 위해 미국 주요 의료혁신기관과의 협력을 넓히고 있다. 고려대의료원은 지난 9월 미국 존스홉킨스 테크놀로지 벤처스(Joh Hoki Techology Veture·JHTV)와 텍사스 메디컬 센터(Texa Medical Ceter·TMC) 관계자들을 잇달아 초청했다. 국내 유망 바이오·의료기업을 미국의 연구·임상·투자 네트워크와 연결하기 위해서다. 지난 9월 4일 고려대학교 메디사이언스파크에서 열린 2026 Korea-JHTV Bio Parterig Day에서는 존스홉킨스대와 한국 기업의 협력 사례가 집중적으로 다뤄졌다. JHTV의 폴 은칸사(Paul Nkaah) 수석이사와 대니얼 캐러비엘로(Daiel Caraviello) 이사는 존스홉킨스의 기술사업화 체계를 소개하고, 오가노이드 기반 약물반응 분석과 의료영상·인공지능(AI), 액체생검 등 한국 기업들과 진행 중인 협력 사례를 공유했다. 연구 성과를 미국 의료현장에서 검증하고 공동개발로 이어가기 위해 존스홉킨스의 임상 전문성과 연구 인프라를 어떻게 활용할 수 있는지도 논의했다. 지난 9월 17일 같은 장소에서 열린 Korea-TMC Bio Parterig Day에서는 미국 시장 진입 전략이 주요 의제로 다뤄졌다. 데이비드 맥도너(David McDoough) TMC 이노베이션 팩토리 EIR은 미국 투자유치와 시장 진출 과정에서 시장 수요와 보험급여 가능성, 지식재산권, 현지 법인구조, 미국 식품의약국(FDA) 인허가 전략 등을 사전에 갖춰야 한다고 강조했다. 기술 자체의 우수성만으로는 충분하지 않으며, 실제 의료현장의 수요와 사업성을 입증하는 과정이 뒷받침돼야 한다고 설명했다. 엘리아나 터틀(Elliaa Tuttle) TMC 디렉터는 휴스턴의 대규모 의료·생명과학 클러스터와 창업 지원체계를 소개했다. TMC 이노베이션 팩토리(Iovatio Factory)를 중심으로 운영되는 치료제·의료기기 창업 지원 프로그램과 벤처펀드, 해외 기업의 미국 시장 진출 지원 사업 등을 설명하며 의료기관과 연구자, 투자자, 기업이 한데 모여 있는 TMC의 강점을 짚었다. 국내 기업의 우수한 기술들도 공유했다. JHTV 행사에는 에이뮨링크, 제놉시, 일릭사파마텍, 아라레연구소 등 4개 기업이 참여해 면역 프로파일링, 액체생검, 약물전달, 수술용 감마카메라 기술 등을 소개했다. TMC 행사에는 에이뮨링크, 온코크로스, 사이알바이오, 체크메이트 테라퓨틱스, 제놉시 등 5개 기업이 참여해 연구개발 성과와 미국 시장 진출 전략을 선보였다. 해외 기관 관계자와 국내 연구자·기업 간 개별 파트너링도 진행됐다. 참여 기업들은 보유 기술의 개발 단계와 향후 계획을 바탕으로 미국에서 필요한 연구 및 임상 협력, 기술검증, 사업화 방안을 논의했으며, 공동연구 등 후속 협력 가능성도 함께 모색했다. 고려대의료원은 이번 행사로 국내 의료기술의 해외 진출을 위한 상시 협력 네트워크로 발전시켜 나갈 계획이다. 고려대의료원은 한국특허전략개발원 IP-TLO 얼라이언스의 글로벌 마케팅 분과장이자 한국보건산업진흥원 H+TLO 네트워크의 주도기관으로서 국내 대학·병원·연구기관 간 기술사업화 협력을 이끌고 있다. 앞으로는 해외 연구기관과 의료기관, 투자기관까지 연결 범위를 넓혀 국내 유망 의료기술의 연구·임상 검증과 사업화를 지원한다는 방침이다. 김학준 고려대 의학연구처장은 "우수한 연구성과가 실제 의료현장에서 활용되고 사업화로 이어지려면 기술개발 초기부터 연구·임상·투자·사업화 분야의 다양한 전문기관이 함께 움직여야 한다"며 "고려대의료원이 국내 연구기관과 기업, 해외 혁신기관을 연결하는 허브 역할을 강화해 실질적인 공동연구와 글로벌 사업화 성과로 이어지도록 지원하겠다"고 말했다.
