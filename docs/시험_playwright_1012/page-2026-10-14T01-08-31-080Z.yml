              - generic [ref=f5e312]:
                - generic [ref=f5e313]: 의료원
                - heading "고려대의료원-식품의약품안전평가원, 바이오·의료 분야 발전 위해 맞손" [level=3] [ref=f5e314]
              - generic [ref=f5e315]: 고려대의료원-식품의약품안전평가원, 바이오·의료 분야 발전 위해 맞손의료진 임상 자문과 식품의약품안전평가원 규제 전문상담 연계백신·의료기기·임상 자문 분야 중심으로 협력 추진 고려대학교의료원(의무부총장 겸 의료원장 윤을식)이 식품의약품안전평가원(원장 강석연)과 바이오헬스 의료제품의 제품화 지원을 위한 업무협약을 체결했다. 지난 1일 고려대 메디사이언스파크 의료원본부에서 열린 협약식에는 고려대 윤을식 의무부총장, 김학준 의학연구처장, 정희진 백신혁신센터장, 박일호 임상연구지원실장, 조금준 구로병원 연구부원장을 비롯한 주요 보직자와 강석연 식품의약품안전평가원장, 김희성 사전상담과장 등 식품의약품안전평가원 관계자들이 참석했다. 이번 협약은 식품의약품안전평가원의 규제 전문성과 고려대의료원의 임상 전문성을 연결한다는 점에서 의미가 크다. 고려대의료원은 분야별 의료진을 통한 임상 기술자문을 연계하고, 식품의약품안전평가원은 허가·심사 기준과 제출 자료 등에 관한 규제 전문상담을 제공한다. 양 기관은 백신과 의료기기, 임상 자문을 중심으로 협력하기 위해 실무협의회를 구성·운영하기로 했다. 고려대의료원 산하 안암·구로·안산 연구중심병원을 비롯해 고려대학교 의과대학 백신혁신센터, 개방형실험실, G밸리의료기기개발지원센터, 의료기기 사용적합성 시험센터 등의 임상·연구 인프라를 연계할 예정이다. 혁신제품을 개발하는 연구자와 기업을 대상으로 임상 의료 기술자문과 규제 전문상담을 결합한 통합 제품화 컨설팅도 매년 정기적으로 실시할 계획이다. 윤을식 의무부총장 겸 의료원장은 “이번 협약은 고려대의료원의 임상·연구 역량과 식품의약품안전평가원의 규제 전문성을 하나로 잇는 출발점”이라며 “우수한 연구와 기술이 실제 의료 현장에서 활용돼 더 많은 환자가 건강한 일상으로 돌아가는 길을 열고, 미래 의료 혁신을 선도해 나가겠다”고 말했다. 강석연 식품의약품안전평가원장은 “의료제품 개발 초기부터 규제 요건을 충분히 살펴보는 것이 원활한 제품화를 위해 중요하다”며 “고려대의료원과의 파트너십을 통해 의료 현장에서 환자에게 필요한 제품이 개발되고 실제 제품화까지 이어질 수 있도록 적극 지원하겠다”고 밝혔다.
