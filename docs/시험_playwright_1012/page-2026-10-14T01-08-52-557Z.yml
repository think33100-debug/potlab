                    - strong [ref=f6e280]: 꼭 지켜야 할 골든타임, 심근경색
                  - paragraph [ref=f6e281]: 우리 몸의 엔진, 심장을 말하다 '세계 심장의 날'- ① 심근경색 9. 29. 글. 한양대학교병원 응급의학과 이상환 교수 심장은 하루도 쉬지 않고 뛰며 온몸으로 혈액을 보낸다. 하지만 심장에 문제가 생겼을 때 우리 몸은 예상보다 다양한 방식으로 신호를 보낸다. 갑작스러운 가슴 통증으로 찾아오는 심근경색, 불규칙한 박동을 일으키는 부정맥, 심장 판막이 좁아지면서 숨 가쁨과 어지럼증을 유발하는 대동맥판막협착증까지. 세계 심장의 날을 맞아 심장이 보내는 위험 신호와 주요 심혈관질환의 증상, 치료, 예방법을 살펴본다. 심장이 보내는 구조신호 놓치지 않는 법 심장은 하루도 쉬지 않고 온몸에 피를 보내는 우리 몸의 엔진이다. 심장에 산소와 영양을 공급하는 혈관이 관상동맥이다. 관상동맥 벽에 쌓여 있던 콜레스테롤 찌꺼기, 즉 죽상경화반이 파열되면 그 자리에 피떡인 혈전이 생겨 혈관을 막는다. 이때 산소 공급이 끊긴 심장근육이 빠르게 손상되는 질환이 급성 심근경색이다. 심근경색은 치명적인 부정맥과 심정지로 이어질 수 있어 신속한 대응이 필요하다. 치료 원칙은 막힌 혈관을 최대한 빨리 다시 여는 것이다. 시간이 지날수록 살릴 수 있는 심장근육은 줄어들고, 치료가 늦어질수록 심부전·부정맥·쇼크 같은 합병증 위험도 커진다. 응급실에서 아무리 빨리 준비해도 환자가 집에서 수시간을 기다린 뒤 도착한다면 이미 중요한 시간을 놓친 셈이다. 심근경색은 꼭 심한 가슴 통증으로만 오지 않는다 가장 전형적인 증상은 가슴 한가운데를 짓누르거나 조이고, 무거운 물체를 올려놓은 듯한 불편감이다. 몇 분 이상 지속되거나 좋아졌다가 다시 나타날 수 있으며, 통증이 왼팔이나 양팔, 어깨, 등, 목, 턱, 명치 쪽으로 퍼지기도 한다. 숨이 차거나 식은땀이 나고 메스꺼움·구토·어지럼증이 함께 나타나는 경우도 흔하다. 하지만 모든 환자가 교과서처럼 아픈 것은 아니다. 일부 환자는 뚜렷한 흉통 없이 갑작스러운 호흡곤란, 심한 피로감, 체한 듯한 불편감, 식은땀이나 실신으로 나타날 수 있다. 특히 고령자와 당뇨병 환자에서는 통증이 뚜렷하지 않을 수 있다. 통증이 약하거나 잠시 좋아졌다고 안전한 것도 아니다. 평소와 다른 가슴 불편감이 새로 생겼거나 걷거나 계단을 오를 때 악화되고 쉬어도 완전히 사라지지 않는다면 즉시 진료를 받아야 한다. 병원에 갈까 고민하지 말고 119를 부른다 심근경색이 의심되면 하던 일을 즉시 멈추고 119에 신고해야 한다. 가족이 올 때까지 기다리거나 직접 운전하거나 소화제를 먹고 증상이 가라앉는지 지켜보는 것은 위험하다. 이동 중 심실세동과 같은 치명적인 부정맥이나 심정지가 발생할 수 있기 때문이다. 평소 니트로글리세린을 처방 받았다면 의료진이 알려준 방법대로 복용하되 약을 먹고 기다리느라 신고를 늦춰서는 안 된다. 구급대는 현장에서 심전도와 활력징후를 확인하고 필요한 응급처치를 시작할 수 있다. 또한 환자 상태를 병원에 미리 전달해 응급실과 심혈관조영실이 준비할 수 있도록 한다. 신고할 때는 증상이 시작된 시각, 통증 부위와 양상, 복용 중인 약과 과거 심장질환 여부를 알려주는 것이 좋다. 구급차를 이용하면 이동 중 응급처치를 받을 수 있고 병원에서도 더욱 신속하게 치료로 연결될 수 있다. 환자가 갑자기 의식을 잃고 정상적으로 숨 쉬지 않는다면 심정지로 진행했을 가능성이 있다. 즉시 119에 신고하고 가슴 중앙을 강하고 빠르게 반복해서 압박해야 한다. 주변에 자동심장충격기가 있다면 음성 안내에 따라 사용한다. 보호자가 시행하는 심폐소생술과 조기 제세동은 구급대가 도착할 때까지 뇌와 심장으로 가는 혈류를 유지하는 생명선이다. 신속한 진단과 혈관 개통 응급실에서는 가능한 한 빨리 12유도 심전도를 시행하고, 혈액검사로 심장근육 손상을 나타내는 트로포닌 수치를 확인한다. 심전도에서 전형적인 변화가 보이는 ‘ST분절 상승 심근경색’은 막힌 관상동맥을 즉시 열어야 하는 초응급질환이다. 첫 심전도가 정상이라고 심근경색이 완전히 배제되는 것은 아니다. 증상과 위험도를 종합했을 때 심근경색이 의심되면 심전도와 트로포닌 검사를 반복하고 심장초음파 등을 추가한다. 또한 대동맥박리·폐색전증·기흉처럼 흉통을 일으키는 다른 응급질환도 함께 확인한다. ST분절 상승 심근경색의 치료는 손목이나 사타구니 혈관으로 가느다란 관을 넣어 막힌 혈관을 다시 여는 관상동맥 중재술이다. 치료는 빠를수록 좋으며 혈류를 회복시키는 것이 중요하다. 심근경색 예방, 생활습관과 건강 수치를 함께 관리한다 심근경색은 어느 날 갑자기 발생하는 것처럼 보이지만 대부분은 오랜 기간 관상동맥에 동맥경화가 쌓인 결과다. 예방의 핵심은 혈관을 손상시키는 위험 요인을 미리 찾아 꾸준히 관리하는 것이다. 가장 중요한 것은 금연이다. 일반 담배뿐 아니라 전자담배와 간접흡연도 피해야 한다. 식사는 채소, 과일, 통곡물, 콩류, 생선과 견과류를 중심으로 하고, 짠 음식과 가공육, 포화지방이 많은 음식, 당이 든 음료는 줄이는 것이 좋다. 운동은 빠르게 걷기처럼 숨이 조금 차지만 대화는 가능한 정도로 하루 30분씩 주 5일 정도 실천하는 것이 좋다. 한 번에 30분이 어렵다면 짧게 나누어 시작해도 되며, 주 2일 정도 근력운동을 더하면 도움이 된다. 생활습관만큼 중요한 것은 자신의 혈압·혈당·콜레스테롤 수치를 아는 것이다. 고혈압, 당뇨병, 고지혈증은 특별한 증상이 없어도 관상동맥을 계속 손상시킬 수 있다. 건강검진에서 이상이 발견되면 치료를 미루지 말고 처방받은 약을 꾸준히 복용해야 한다. 특히 흡연자, 당뇨병·만성콩팥병 환자, 젊은 나이에 심근경색을 앓은 가족이 있는 사람은 의료진과 심혈관질환 발생 위험을 평가하고 필요한 치료를 상담하는 것이 좋다. 아스피린이 심근경색을 예방한다는 말을 듣고 임의로 복용해서는 안 된다. 심혈관질환이 없던 사람이 예방 목적으로 복용하면 출혈 위험이 예방 효과보다 클 수 있으므로, 개인의 심혈관 위험도와 출혈 가능성을 평가한 뒤 의료진이 복용 여부를 결정해야 한다. 평소에는 위험 요인을 꾸준히 관리하고, 의심되는 증상이 나타나면 지체 없이 119에 신고하는 것이 심근경색으로부터 심장을 지키는 가장 확실한 방법이다.
