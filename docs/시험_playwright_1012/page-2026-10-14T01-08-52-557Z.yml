                  - paragraph [ref=f6e255]: "한양대학교병원 루게릭병 클리닉에서는 루게릭병의 치료 전략과 관리법에 대한 강의를 정기적으로 진행하고 있습니다. 이번 강좌에서는 한양대학교병원 재활의학과 최수진 교수님과 함께 루게릭병 환자와 가족분들을 위한 핵심 호흡재활 전략에 대해 알아봅니다. 루게릭병은 팔다리 근육뿐만 아니라 숨쉬는 근육, 기침하는 근육, 삼키는 근육에도 영향을 미칩니다. 호흡재활은 숨이 심하게 찰 때 시작하는 마지막 치료가 아니라, 호흡근 약화와 분비물 문제를 미리 살펴보고 적절한 시점에 준비하는 조기 치료 과정입니다. 가정에서 할 수 있는 호흡 관리법부터 비침습환기(NIV)와 기침유발기(MI-E)의 올바른 이해까지, 환자분들이 더 편안하고 안전하게 지내실 수 있도록 돕는 유익한 정보들을 확인해 보세요. (강의 일자 : 26년 7월 11일) ⏱️ 목차 00:00 강좌 소개 및 오늘 나눌 이야기 00:48 1. 왜 호흡 관리가 중요한가? (숨쉬기와 기침·분비물) 01:59 2. 미리 살펴야 할 호흡 기능 저하 의심 증상들 02:38 정기적으로 확인해야 하는 호흡 검사 종류 (폐활량, 호흡 근력 등) 05:37 3. 비침습환기(NIV)란 무엇이고, 왜 필요한가요? 07:11 권장하는 비침습환기(NIV) 사용 시점과 효과 08:15 4. 기침보조와 가래·침 관리 방법 12:17 5. 집에서 가족과 함께 할 수 있는 호흡 관리법 13:51 오늘 꼭 기억해야 할 6가지 핵심 메시지 [의료진 바로가기 -재활의학과 최수진 교수] [한양대학교병원 루게릭병 클리닉 유튜브 채널] [주의사항 및 안내] ※ 본 영상에서 제공하는 의학 정보는 일반적인 지식을 전달하기 위한 목적으로 제작되었습니다. ※ 본 영상의 내용은 의료진의 직접적인 진찰을 대신할 수 없습니다. 질환의 진단, 치료, 처방 등 의학적 결정은 반드시 병원에 내원하여 전문의와 상담하시기 바랍니다. ※ 의학적 치료법이나 권고 사항은 환자 개인의 건강 상태(기저질환, 연령, 기왕력, 증상의 정도 등)와 적응증에 따라 다를 수 있습니다. 따라서 본 영상의 내용을 모든 환자에게 일률적으로 적용해서는 안 됩니다. ※ 의학 정보는 연구 결과와 치료 가이드라인의 변화에 따라 업데이트될 수 있습니다. 영상 제작 시점의 정보를 기준으로 하므로, 최신 치료법에 대해서는 담당 주치의와 상의하십시오."
