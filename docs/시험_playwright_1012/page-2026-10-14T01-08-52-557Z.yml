                    - strong [ref=f6e302]: 전체 유방암의 10%는 '유전'... 건강보험 적용되는 유전자 검사 대상자는?
                  - paragraph [ref=f6e303]: 어머니, 이모, 혹은 할머니가 유방암을 앓으셨다면 나도 유방암에 걸릴 확률이 높을까요? 전체 유방암 환자의 약 5~10%는 유전자 변이로 인해 발생하는 '유전성 유방암'입니다. 이번 영상에서는 유전성 유방암의 가장 대표적인 원인인 'BRCA 유전자 변이'와 가족력의 기준, 건강보험 적용을 받아 BRCA 유전자 검사를 진행할 수 있는 구체적인 대상자 기준을 정리해 드립니다. [바로가기 - 외과 정민성 교수] If your mother, aunt, or grandmother had breast cancer, does that mean you also have a high risk of developing it? About 5 to 10% of all breast cancer cases are 'hereditary breast cancers' caused by genetic mutations. In this video, we will cover the 'BRCA gene mutation'—the most common cause of hereditary breast cancer—along with the criteria for determining family history, and the specific eligibility guidelines for receiving BRCA genetic testing covered by national health insurance. [주의사항 및 안내] ※ 본 영상에서 제공하는 의학 정보는 일반적인 지식을 전달하기 위한 목적으로 제작되었습니다. ※ 본 영상의 내용은 의료진의 직접적인 진찰을 대신할 수 없습니다. 질환의 진단, 치료, 처방 등 의학적 결정은 반드시 병원에 내원하여 전문의와 상담하시기 바랍니다. ※ 의학적 치료법이나 권고 사항은 환자 개인의 건강 상태(기저질환, 연령, 기왕력, 증상의 정도 등)와 적응증에 따라 다를 수 있습니다. 따라서 본 영상의 내용을 모든 환자에게 일률적으로 적용해서는 안 됩니다. ※ 의학 정보는 연구 결과와 치료 가이드라인의 변화에 따라 업데이트될 수 있습니다. 영상 제작 시점의 정보를 기준으로 하므로, 최신 치료법에 대해서는 담당 주치의와 상의하십시오. [Notice Disclaimer] ※ The medical information provided in this video is intended for general informational purposes only. ※ The content of this video cannot replace a direct medical examination by a healthcare professional. Please visit a hospital to consult with a specialist regarding medical decisions, including diagnosis, treatment, and prescriptions. ※ Medical treatments or recommendations may vary depending on an individual patient’s health status (such as underlying conditions, age, medical history, and symptom severity) and clinical indications. Therefore, the information in this video should not be applied uniformly to all patients. ※ Medical information is subject to change based on research findings and updates to clinical guidelines. This content is based on the information available at the time of production; please consult your attending physician regarding the latest treatment options.
