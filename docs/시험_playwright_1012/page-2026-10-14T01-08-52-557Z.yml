                  - paragraph [ref=f6e242]: "한양대학교병원 루게릭병 클리닉에서는 루게릭병의 치료 전략과 관리법에 대한 강의를 정기적으로 진행하고 있습니다. 이번 강좌에서는 한양대학교병원 사회복지팀 장영주 의료사회복지사님과 함께 루게릭병 환우와 가족분들이 꼭 알아야 할 '사회복지제도'에 대해 상세히 알아봅니다. 루게릭병 진단 후 발생할 수 있는 경제적, 신체적 어려움을 덜어드리기 위해 국가와 지자체에서 제공하는 다양한 지원 제도를 4가지 핵심 분야(치료비, 생계, 장애인, 돌봄 지원)로 나누어 알기 쉽게 정리해 드립니다. 진료비 부담을 줄여주는 산정특례 및 본인부담상한제부터, 가장 적절한 장애인 등록 시기, 그리고 환우의 일상을 돕는 노인장기요양보험과 활동지원 서비스까지 실질적으로 꼭 필요한 정보들을 영상에서 확인해 보세요. (강의 일자 : 26년 7월 11일) ⏱️ 목차 [1부: 치료비 지원] 00:27 1. 본인일부부담금 산정특례제도 02:37 2. 본인부담상한제 05:12 3. 희귀질환자 의료비 지원사업 07:14 4. 재난적 의료비 지원사업 09:16 5. 긴급복지 의료지원 11:29 6. 차상위 본인부담경감대상자 지원사업 [2부: 생계 지원] 12:27 1. 다양한 연금제도 비교 14:30 2. 국민기초생활보장제도 16:02 3. 차상위계층 확인사업 17:28 4. 긴급복지 지원사업 [3부: 장애인 지원] 18:35 1. 루게릭병 환우의 장애인 등록 21:42 2. 국민연금 내 장애연금 23:35 3. 장애인 연금 및 장애수당 23:59 4. 장애인 활동지원사업 25:14 5. 장애인 보조기기 지원사업 25:31 6. 장애인 택시지원 [4부: 돌봄 지원] 26:33 1. 통합돌봄 서비스 27:39 2. 노인장기요양보험제도 32:21 3. 일상돌봄 서비스 32:56 4. 가사·간병 방문 지원사업 33:34 5. 긴급돌봄 지원사업 33:58 6. 119 안심콜 [5부: 기타 지원 및 마무리] 35:06 1. 희소·긴급도입 필요 의료기기 공급 사업 안내 35:37 2. 도움이 되는 주요 민간/공공 사이트 및 필요 서류 발급 기관 안내 35:59 3. 한양대학교병원 사회복지팀 상담 이용 안내 및 강좌 마무리 ※ 도움이 되는 사이트 [질병관리청 희귀질환헬프라인] [질병관리청] [보건복지부] [보건복지부 복지포털(복지로)] [국민건강보험공단] [국민건강보험공단 노인장기요양보험] [국민연금공단] [한국루게릭병(ALS)협회] [(사)한국희귀·난치성질환 연합회 환우 모임] [승일희망재단] ※서류 발급 기관 사이트 [정부24] [부동산공시가격 알리미] [전자가족관계등록시스템] [국세청 홈텍스] [인터넷등기소] [내보험 찾아줌] [내보험 다보여] [한양대학교병원 루게릭병 클리닉 유튜브 채널]"
